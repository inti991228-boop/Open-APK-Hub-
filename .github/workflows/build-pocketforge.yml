name: Build PocketForge AI APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pocketforge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            IRIDIS/gradle/wrapper/gradle-wrapper.properties
            IRIDIS/gradle/libs.versions.toml

      - name: Install Android SDK 36, NDK r30, and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;30.0.16248370"
          printf 'ndk.path=%s\n' "$ANDROID_HOME/ndk/30.0.16248370" > IRIDIS/local.properties

      - name: Fetch pinned native dependencies
        working-directory: IRIDIS
        run: sh scripts/fetch-deps.sh

      - name: Build full release APK
        working-directory: IRIDIS
        run: ./gradlew assembleFullRelease --no-daemon --max-workers=2

      - name: Sign and verify APK
        id: sign
        env:
          APK_OUTPUT: IRIDIS/PocketForge_AI_v2_Full.apk
        run: |
          set -euo pipefail
          unsigned_apk="IRIDIS/app/build/outputs/apk/full/release/app-full-release-unsigned.apk"
          keystore="$RUNNER_TEMP/pocketforge-test.jks"
          aligned_apk="$RUNNER_TEMP/pocketforge-aligned.apk"
          store_password="$(openssl rand -hex 24)"

          test -f "$unsigned_apk"
          keytool -genkeypair -noprompt \
            -keystore "$keystore" \
            -storetype JKS \
            -storepass "$store_password" \
            -keypass "$store_password" \
            -alias pocketforge-test \
            -keyalg RSA \
            -keysize 3072 \
            -validity 3650 \
            -dname "CN=PocketForge AI Test"

          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          "$build_tools/zipalign" -f -p 4 "$unsigned_apk" "$aligned_apk"
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-type JKS \
            --ks-key-alias pocketforge-test \
            --ks-pass "pass:$store_password" \
            --key-pass "pass:$store_password" \
            --out "$APK_OUTPUT" \
            "$aligned_apk"
          "$build_tools/apksigner" verify --verbose "$APK_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketForge_AI_v2_Full
          path: IRIDIS/PocketForge_AI_v2_Full.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish test prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: IRIDIS/PocketForge_AI_v2_Full.apk
        run: |
          tag="pocketforge-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "$APK_PATH#PocketForge_AI_v2_Full.apk" \
            --target "$GITHUB_SHA" \
            --title "PocketForge AI v2 test build ${GITHUB_RUN_NUMBER}" \
            --notes "Signed with a temporary per-run test key. Reinstalling updates with a different signature requires uninstalling the previous build." \
            --prerelease
